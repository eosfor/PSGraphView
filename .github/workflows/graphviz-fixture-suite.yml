name: psgraphview-graphviz-fixture-suite

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      graphviz_runtime_version:
        description: 'Bundled Graphviz runtime version, e.g. 0.1.0-beta.12'
        required: false
        default: '0.1.0-beta.12'
      fixture_tier:
        description: 'Fixture tier to run: core, extended, or all'
        required: false
        default: 'core'

  push:
    paths:
      - '.github/workflows/graphviz-fixture-suite.yml'
      - 'eng/Invoke-GraphvizFixtureSuite.ps1'
      - 'eng/Test-GraphvizNoSystemSmoke.ps1'
      - 'eng/Install-GraphvizRuntimeBundle.ps1'
      - 'tests/Fixtures/Graphviz/**'
      - 'src/PSGraphView.Graphviz/**'
      - 'src/PSGraphView.PowerShell/**'

  pull_request:
    paths:
      - '.github/workflows/graphviz-fixture-suite.yml'
      - 'eng/Invoke-GraphvizFixtureSuite.ps1'
      - 'eng/Test-GraphvizNoSystemSmoke.ps1'
      - 'eng/Install-GraphvizRuntimeBundle.ps1'
      - 'tests/Fixtures/Graphviz/**'
      - 'src/PSGraphView.Graphviz/**'
      - 'src/PSGraphView.PowerShell/**'

jobs:
  fixture-suite:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: ${{ matrix.os }} / ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2022
            rid: win-x64
          - os: macos-14
            rid: osx-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install PowerShell
        uses: PSModule/install-powershell@v1
        with:
          Version: latest

      - name: Validate Graphviz runtime token
        shell: pwsh
        env:
          PSGRAPHVIEW_GITHUB_TOKEN: ${{ secrets.GRAPHVIZ_RUNTIME_GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PSGRAPHVIEW_GITHUB_TOKEN)) {
            throw 'GRAPHVIZ_RUNTIME_GITHUB_TOKEN secret is required for the bundled Graphviz fixture workflow.'
          }

      - name: Resolve fixture suite parameters
        id: parameters
        shell: pwsh
        run: |
          $graphvizRuntimeVersion = '${{ github.event.inputs.graphviz_runtime_version }}'
          if ([string]::IsNullOrWhiteSpace($graphvizRuntimeVersion)) {
            $graphvizRuntimeVersion = '0.1.0-beta.12'
          }

          $fixtureTier = '${{ github.event.inputs.fixture_tier }}'
          if ('${{ github.event_name }}' -eq 'schedule') {
            $fixtureTier = 'extended'
          }
          elseif ([string]::IsNullOrWhiteSpace($fixtureTier)) {
            $fixtureTier = 'core'
          }

          "graphviz_runtime_version=$graphvizRuntimeVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "fixture_tier=$fixtureTier" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore PowerShell module
        shell: pwsh
        run: |
          dotnet restore ./src/PSGraphView.PowerShell/PSGraphView.PowerShell.csproj

      - name: Publish module with bundled Graphviz runtime
        shell: pwsh
        env:
          PSGRAPHVIEW_GITHUB_TOKEN: ${{ secrets.GRAPHVIZ_RUNTIME_GITHUB_TOKEN }}
        run: |
          $graphvizRuntimeVersion = '${{ steps.parameters.outputs.graphviz_runtime_version }}'

          $publishDirectory = Join-Path $PWD 'artifacts/PSGraphView/${{ matrix.rid }}'
          dotnet publish ./src/PSGraphView.PowerShell/PSGraphView.PowerShell.csproj `
            --configuration Release `
            --no-restore `
            -o $publishDirectory `
            -p:IncludeGraphvizRuntimeBundle=true `
            -p:GraphvizRuntimeVersion=$graphvizRuntimeVersion

      - name: Run Graphviz fixture suite
        shell: pwsh
        run: |
          $fixtureTier = '${{ steps.parameters.outputs.fixture_tier }}'

          $publishDirectory = Join-Path $PWD 'artifacts/PSGraphView/${{ matrix.rid }}'
          $manifestPath = Join-Path $publishDirectory 'PSGraphView.psd1'
          $outputDirectory = Join-Path $PWD 'artifacts/graphviz-fixture-suite/${{ matrix.rid }}/' + $fixtureTier

          pwsh -NoLogo -NoProfile -File ./eng/Invoke-GraphvizFixtureSuite.ps1 `
            -ModuleManifestPath $manifestPath `
            -Tier $fixtureTier `
            -OutputDirectory $outputDirectory `
            -RequireBundledGraphvizRuntime

      - name: Upload fixture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphviz-fixture-suite-${{ matrix.rid }}-${{ steps.parameters.outputs.fixture_tier }}
          path: artifacts/graphviz-fixture-suite/${{ matrix.rid }}
          if-no-files-found: warn
