name: psgraphview-publish

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: 'Module version without prerelease suffix, e.g. 0.1.0'
        required: true
        default: '0.2.0'
      dry_run:
        description: 'Run the full publish validation but skip Publish-Module'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Optional prerelease label, e.g. beta1'
        required: false
        default: 'beta1'
      graphviz_runtime_version:
        description: 'Graphviz runtime version to bundle, e.g. 0.1.0-beta.12'
        required: false
        default: '0.1.0-beta.12'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        dotnet-version: ['9.0.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Clone PSGraph for DSM-backed test projects
        shell: bash
        run: |
          sibling_repo="$(cd "$GITHUB_WORKSPACE/.." && pwd)/PSGraph"
          rm -rf "$sibling_repo"
          git clone --depth 1 --branch dev https://github.com/eosfor/PSGraph.git "$sibling_repo"
          ln -sfn "$sibling_repo" "$GITHUB_WORKSPACE/PSGraph"
          test -f "$sibling_repo/DSM/DSM.csproj"

      - name: Install PowerShell
        uses: PSModule/install-powershell@v1
        with:
          Version: latest

      - name: Resolve version inputs
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'release') {
            $tag = '${{ github.ref }}' -replace '^refs/tags/', ''
            $tag = $tag -replace '^v', ''
            if ($tag -notmatch '^([0-9]+\.[0-9]+\.[0-9]+)(?:-([A-Za-z0-9\-]+))?$') {
              Write-Error 'Bad tag format. Expected vX.Y.Z or vX.Y.Z-label.'
              exit 1
            }

            $version = $Matches[1]
            $prerelease = $Matches[2]
          }
          else {
            $version = '${{ github.event.inputs.version }}'
            $prerelease = '${{ github.event.inputs.prerelease }}'
            if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
              Write-Error 'Manual version must be X.Y.Z.'
              exit 1
            }
          }

          $isPrerelease = [string]::IsNullOrWhiteSpace($prerelease) -eq $false
            $configuration = if ($isPrerelease) { 'Debug' } else { 'Release' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "configuration=$configuration" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ steps.version.outputs.configuration }} --no-restore

      - name: Run tests
        run: dotnet test --configuration ${{ steps.version.outputs.configuration }} --no-build --verbosity normal

      - name: Publish PowerShell module
        env:
          PSGRAPHVIEW_GITHUB_TOKEN: ${{ secrets.GRAPHVIZ_RUNTIME_GITHUB_TOKEN }}
        run: |
          graphviz_runtime_version='${{ github.event.inputs.graphviz_runtime_version }}'
          if [ -z "$graphviz_runtime_version" ]; then
            graphviz_runtime_version='0.1.0-beta.12'
          fi

          dotnet publish src/PSGraphView.PowerShell/PSGraphView.PowerShell.csproj \
            --configuration ${{ steps.version.outputs.configuration }} \
            --no-build \
            -o ./PSGraphView \
            -p:IncludeGraphvizRuntimeBundle=true \
            -p:GraphvizRuntimeVersion="$graphviz_runtime_version"

      - name: Update module manifest version
        shell: pwsh
        run: |
          $manifest = Join-Path $PWD 'PSGraphView/PSGraphView.psd1'
          $version = '${{ steps.version.outputs.version }}'
          $prerelease = '${{ steps.version.outputs.prerelease }}'

          if ([string]::IsNullOrWhiteSpace($prerelease)) {
            Update-ModuleManifest -Path $manifest -ModuleVersion $version -Prerelease ''
          }
          else {
            Update-ModuleManifest -Path $manifest -ModuleVersion $version -Prerelease $prerelease
          }

          $metadata = Test-ModuleManifest -Path $manifest
          if ($metadata.Version.ToString() -ne $version) {
            throw "Published manifest version '$($metadata.Version)' does not match expected version '$version'."
          }

          $manifestPrerelease = $metadata.PrivateData.PSData.Prerelease
          if ([string]::IsNullOrWhiteSpace($prerelease)) {
            if (-not [string]::IsNullOrWhiteSpace($manifestPrerelease)) {
              throw "Published manifest prerelease '$manifestPrerelease' should be empty for a stable release."
            }
          }
          elseif ($manifestPrerelease -ne $prerelease) {
            throw "Published manifest prerelease '$manifestPrerelease' does not match expected prerelease '$prerelease'."
          }

      - name: Smoke published module bundle
        shell: pwsh
        run: |
          $manifest = Join-Path $PWD 'PSGraphView/PSGraphView.psd1'
          $outputDirectory = Join-Path $PWD 'artifacts/publish-smoke'

          pwsh -NoLogo -NoProfile -File ./eng/Test-GraphvizNoSystemSmoke.ps1 `
            -ModuleManifestPath $manifest `
            -OutputDirectory $outputDirectory `
            -RequireBundledGraphvizRuntime

      - name: Upload dry-run artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: psgraphview-publish-dry-run
          path: |
            PSGraphView
            artifacts/publish-smoke
          if-no-files-found: error

      - name: Skip PSGallery publish in dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          echo "Dry-run mode is enabled. Skipping Publish-Module."

      - name: Publish PowerShell module to PSGallery
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        shell: pwsh
        run: |
          Publish-Module -Path './PSGraphView' -NuGetApiKey '${{ secrets.PS_GALLERY_SECRET }}'
